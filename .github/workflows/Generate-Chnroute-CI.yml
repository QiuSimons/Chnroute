name: Generate Chnroute

on:
  schedule:
    - cron: '11 19 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup dependencies
        run: |
          pip3 install --no-cache-dir aggregate6

      - name: Generate route list
        run: |
          chmod +x ./chnroute.sh ./mapcidr
          ./chnroute.sh
          ./mapcidr -cl ./dist/chnroute/chnroute.txt -o ./dist/chnroute/TMP4.txt -a
          cat ./dist/chnroute/TMP4.txt > ./dist/chnroute/chnroute.txt
          rm -f ./dist/chnroute/TMP4.txt

      - name: Commit and push changes
        run: |
          # 仅当 IP 列表发生实质变化时才记录时间并提交，杜绝空跑
          if ! git diff --quiet dist/chnroute/chnroute.txt; then
            echo "$(date +'%Y/%m/%d %H:%M:%S %Z')" > ./update.txt
            git config --global user.email "simonsqiu@foxmail.com"
            git config --global user.name "SimonsQiu"
            git add dist/chnroute/chnroute.txt ./update.txt
            git commit -m "Update chnroute list $(date +'%Y/%m/%d')"
            git push origin master
          else
            echo "Chnroute list has not changed. Skipping commit."
          fi
